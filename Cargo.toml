[package]
name = "cargo-gc"
version = "0.1.0"
edition = "2024"

[dependencies]
cap-std = "4.0"
cap-fs-ext = "4.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
same-file = "1.0"
tempfile = "3.13"
toml = "0.8"
walkdir = "2.5"
